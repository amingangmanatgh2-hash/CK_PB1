name: Publish CK_PB1 Pages

# Publishes the public GitHub Pages site (site content = the Main branch) so
# the Google Search Console verification file and the project docs are served
# at https://<owner>.github.io/CK_PB1/.
on:
  push:
    branches: ['Main', 'arena/**']
  workflow_dispatch:

permissions:
  pages: write
  contents: read
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Build & deploy the Pages site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Main (site content)
        uses: actions/checkout@v4
        with:
          ref: Main

      - name: Configure (and enable) GitHub Pages
        id: config
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
