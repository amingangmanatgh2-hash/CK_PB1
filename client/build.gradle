plugins {
    id 'fabric-loom' version '1.7.4'
}

version = "${project.ckpb1_version}+mc${project.ckpb1_minecraft}"
base { archivesName = 'CK_PB1-Client' }

// The CK_PB1 client jar is built from three source roots:
//   client/src/main/java  -> engine (events, module system, mixins, HUD, GUI)
//   modules/src/main/java -> module implementations (Combat, Movement, BedWars, ...)
//   source/src/main/java  -> shared CK_PB1 library (versioning, JSON, release API)
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../modules/src/main/java', '../source/src/main/java']
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.ckpb1_minecraft}"
    mappings "net.fabricmc:yarn:${project.ckpb1_yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.ckpb1_fabric_loader}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

jar {
    from(rootProject.file('LICENSE')) { rename { "${it}_LICENSE" } }
}
