// CK_PB1 - root build configuration
// Repository layout:
//   source/   -> shared library sources (compiled into both the client and the launcher)
//   client/   -> Fabric client mod (engine, mixins, HUD, GUI)
//   modules/  -> CK_PB1 module implementations (compiled into the client jar)
//   launcher/ -> CK_PB1 desktop launcher (Swing)
//   installer/-> NSIS Windows installer + packaging scripts

allprojects {
    group = 'ck.pb1'
    version = '1.0.0'
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
}
